[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-platform-core"
version = "0.1.0"
description = "Reusable multi-tenant core for GI products and verticals"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Internal project license"}
authors = [{name = "GI Platform"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["gi_platform_core*"]
